
name: Bouw TS6 Droid NL met Meerdere Favorieten

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/maak_nederlands.py"
      - "scripts/maak_32_64_bit.py"
      - "maak_ptt_zijknop.py"
      - "maak_rogerpiep.py"
      - "maak_audio_pttconnect_3toon.py"
      - "maak_volume_media.py"
      - "maak_meerdere_favorieten.py"
      - ".github/workflows/ts6-nederlands.yml"

permissions:
  contents: read

jobs:
  apk:
    name: TS6 Droid NL 32-bit 64-bit Favorieten PTT Rogerpiep
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Nederlandse bestanden downloaden
        uses: actions/checkout@v4
        with:
          path: dutch-files

      - name: Originele TS6 Droid downloaden
        uses: actions/checkout@v4
        with:
          repository: YUAXI/TS6_Droid_CN
          ref: 56d3b4d1991a4c565b1f75f419f4563e772f9614
          path: upstream

      - name: TeamSpeak Rust broncode downloaden
        uses: actions/checkout@v4
        with:
          repository: wslinnn/tslib_multi
          ref: 8e0bc1150b548f31e0cc859ae8b9d488bd355038
          path: tslib

      - name: Nederlandse functies en favorieten toepassen
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p upstream/scripts

          cp dutch-files/scripts/maak_nederlands.py \
            upstream/scripts/

          cp dutch-files/scripts/maak_32_64_bit.py \
            upstream/scripts/

          cp dutch-files/maak_ptt_zijknop.py \
            upstream/scripts/

          cp dutch-files/maak_rogerpiep.py \
            upstream/scripts/

          cp dutch-files/maak_audio_pttconnect_3toon.py \
            upstream/scripts/

          cp dutch-files/maak_volume_media.py \
            upstream/scripts/

          cp dutch-files/maak_meerdere_favorieten.py \
            upstream/scripts/

          cd upstream

          echo "Stap 1: Nederlands instellen"
          python3 scripts/maak_nederlands.py

          echo "Stap 2: 32-bit en 64-bit instellen"
          python3 scripts/maak_32_64_bit.py

          echo "Stap 3: PTT zijknop en schermknop"
          python3 scripts/maak_ptt_zijknop.py

          echo "Stap 4: Rogerpiep instellen"
          python3 scripts/maak_rogerpiep.py

          echo "Stap 5: Kraakvrije audio en 3-tonige rogerpiep"
          python3 scripts/maak_audio_pttconnect_3toon.py

          echo "Stap 6: Luidsprekervolume"
          python3 scripts/maak_volume_media.py

          echo "Stap 7: Meerdere serverfavorieten"
          python3 scripts/maak_meerdere_favorieten.py

      - name: TeamSpeak patches toepassen
        shell: bash
        run: |
          set -euo pipefail

          cd tslib

          git apply --check \
            ../upstream/patches/tslib_multi-8e0bc11-whisper-groups.patch

          git apply \
            ../upstream/patches/tslib_multi-8e0bc11-whisper-groups.patch

          git apply --check \
            ../upstream/patches/tslib_multi-8e0bc11-away-status.patch

          git apply \
            ../upstream/patches/tslib_multi-8e0bc11-away-status.patch

      - name: Java 17 installeren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK en NDK installeren
        shell: bash
        run: |
          set -euo pipefail

          echo "Android SDK: $ANDROID_HOME"

          SDK_MANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$SDK_MANAGER" ]; then
            echo "::error::sdkmanager niet gevonden"
            exit 1
          fi

          echo "SDK Manager: $SDK_MANAGER"

          "$SDK_MANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          NDK_PATH="$ANDROID_HOME/ndk/27.2.12479018"

          if [ ! -d "$NDK_PATH" ]; then
            echo "::error::Android NDK ontbreekt"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Rust 32-bit installeren
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Rust cache instellen
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tslib

      - name: Cargo NDK installeren
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked

      - name: TeamSpeak 32-bit bibliotheek bouwen
        shell: bash
        working-directory: tslib
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -euo pipefail

          export ANDROID_NDK="$ANDROID_NDK_HOME"

          cargo ndk --platform 29 \
            -t armeabi-v7a \
            -o ../upstream/app/src/main/jniLibs \
            build --release \
            -p tslib-jni \
            --features vendored-openssl \
            -j2

      - name: TeamSpeak bibliotheken controleren
        shell: bash
        run: |
          set -euo pipefail

          LIB32="upstream/app/src/main/jniLibs/armeabi-v7a/libtslib_jni.so"
          LIB64="upstream/app/src/main/jniLibs/arm64-v8a/libtslib_jni.so"

          test -s "$LIB32"
          test -s "$LIB64"

          file "$LIB32"
          file "$LIB64"

          readelf -h "$LIB32" | grep -q "ELF32"
          readelf -h "$LIB64" | grep -q "ELF64"

          echo "32-bit en 64-bit aanwezig"

      - name: Gradle cache instellen
        uses: gradle/actions/setup-gradle@v4

      - name: Android tests uitvoeren
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --no-daemon \
            testDebugUnitTest \
            -x buildRustLibs

      - name: APK met meerdere favorieten bouwen
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail

          ./gradlew --no-daemon \
            assembleDebug \
            -x buildRustLibs

      - name: APK controleren en hernoemen
        shell: bash
        run: |
          set -euo pipefail

          APK="upstream/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          for abi in armeabi-v7a arm64-v8a; do
            unzip -Z1 "$APK" \
              | grep -Fx "lib/$abi/libtslib_jni.so" \
              || {
                echo "::error::APK mist $abi"
                exit 1
              }
          done

          cp "$APK" \
            TS6-Droid-NL-Meerdere-Favorieten-32bit-64bit.apk

          sha256sum \
            TS6-Droid-NL-Meerdere-Favorieten-32bit-64bit.apk \
            > TS6-Droid-NL-Meerdere-Favorieten-32bit-64bit.apk.sha256

      - name: Nieuwe APK beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: TS6-Droid-NL-Meerdere-Favorieten-32bit-64bit-APK
          path: |
            TS6-Droid-NL-Meerdere-Favorieten-32bit-64bit.apk
            TS6-Droid-NL-Meerdere-Favorieten-32bit-64bit.apk.sha256
          if-no-files-found: error
          retention-days: 30
