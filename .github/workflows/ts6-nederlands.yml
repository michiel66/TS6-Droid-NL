
name: Bouw TS6 Droid NL 32-bit en 64-bit

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/maak_nederlands.py"
      - "scripts/maak_32_64_bit.py"
      - ".github/workflows/ts6-nederlands.yml"

permissions:
  contents: read

jobs:
  apk:
    name: Android APK 32-bit en 64-bit
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Nederlandse bestanden downloaden
        uses: actions/checkout@v4
        with:
          path: dutch-files

      - name: Originele TS6 Droid downloaden
        uses: actions/checkout@v4
        with:
          repository: YUAXI/TS6_Droid_CN
          ref: 56d3b4d1991a4c565b1f75f419f4563e772f9614
          path: upstream

      - name: TeamSpeak Rust broncode downloaden
        uses: actions/checkout@v4
        with:
          repository: wslinnn/tslib_multi
          ref: 8e0bc1150b548f31e0cc859ae8b9d488bd355038
          path: tslib

      - name: Nederlandse taal instellen
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p upstream/scripts

          cp dutch-files/scripts/maak_nederlands.py \
            upstream/scripts/

          cp dutch-files/scripts/maak_32_64_bit.py \
            upstream/scripts/

          cd upstream

          python3 scripts/maak_nederlands.py
          python3 scripts/maak_32_64_bit.py

      - name: TeamSpeak patches toepassen
        shell: bash
        run: |
          set -euo pipefail

          cd tslib

          git apply --check \
            ../upstream/patches/tslib_multi-8e0bc11-whisper-groups.patch

          git apply \
            ../upstream/patches/tslib_multi-8e0bc11-whisper-groups.patch

          git apply --check \
            ../upstream/patches/tslib_multi-8e0bc11-away-status.patch

          git apply \
            ../upstream/patches/tslib_multi-8e0bc11-away-status.patch

      - name: Java 17 installeren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub Ubuntu heeft al een Android SDK.
      # De defecte setup-android stap is verwijderd.

      - name: Android NDK installeren
        shell: bash
        run: |
          set -euo pipefail

          echo "Android SDK: $ANDROID_HOME"

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          NDK_PATH="$ANDROID_HOME/ndk/27.2.12479018"

          test -d "$NDK_PATH"

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Rust 32-bit installeren
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Rust cache instellen
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tslib

      - name: Cargo NDK installeren
        shell: bash
        run: |
          cargo install cargo-ndk --locked

      - name: TeamSpeak 32-bit bibliotheek bouwen
        shell: bash
        working-directory: tslib
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -euo pipefail

          export ANDROID_NDK="$ANDROID_NDK_HOME"

          cargo ndk --platform 29 \
            -t armeabi-v7a \
            -o ../upstream/app/src/main/jniLibs \
            build --release \
            -p tslib-jni \
            --features vendored-openssl \
            -j2

      - name: Beide TeamSpeak bibliotheken controleren
        shell: bash
        run: |
          set -euo pipefail

          for abi in armeabi-v7a arm64-v8a; do

            LIB="upstream/app/src/main/jniLibs/$abi/libtslib_jni.so"

            if [ ! -s "$LIB" ]; then
              echo "::error::Bibliotheek ontbreekt: $abi"
              exit 1
            fi

            file "$LIB"

          done

      - name: Gradle cache instellen
        uses: gradle/actions/setup-gradle@v4

      - name: Android tests uitvoeren
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --no-daemon \
            testDebugUnitTest \
            -x buildRustLibs

      - name: Nederlandse Android APK bouwen
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail

          ./gradlew --no-daemon \
            assembleDebug \
            -x buildRustLibs

      - name: APK controleren
        shell: bash
        run: |
          set -euo pipefail

          APK="upstream/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          for abi in armeabi-v7a arm64-v8a; do

            unzip -Z1 "$APK" \
              | grep -Fx "lib/$abi/libtslib_jni.so" \
              || {
                echo "::error::APK mist architectuur: $abi"
                exit 1
              }

          done

          cp "$APK" TS6-Droid-NL-32bit-64bit.apk

          sha256sum TS6-Droid-NL-32bit-64bit.apk \
            > TS6-Droid-NL-32bit-64bit.apk.sha256

      - name: APK beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: TS6-Droid-NL-32bit-64bit-APK
          path: |
            TS6-Droid-NL-32bit-64bit.apk
            TS6-Droid-NL-32bit-64bit.apk.sha256
          if-no-files-found: error
          retention-days: 30
